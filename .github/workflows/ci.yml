name: CI

# WAL-07.1: lint and unit tests on every pull request (NFR-OPS-01).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payflow-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: payflow-backend/package-lock.json

      - run: npm ci

      # The type-aware lint and the tests need the generated Prisma client.
      - run: npm run prisma:generate

      - run: npm run lint

      - run: npm test

  frontend:
    name: Frontend lint, format and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payflow-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: payflow-frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      # Frontend unit tests (Vitest). --if-present skips the step on branches
      # that have no test script yet.
      - run: npm test --if-present

      # tsc -b type-checks the app, then Vite builds it.
      - run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:3000/api/v1

  # WAL-07.2: API tests against a real PostgreSQL 16 service container.
  api-tests:
    name: API tests (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payflow-backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: payflow_db
          POSTGRES_USER: payflow_admin
          POSTGRES_PASSWORD: ci_admin_password
        ports:
          - 5432:5432
        # Wait until the database accepts connections before the steps start.
        options: >-
          --health-cmd "pg_isready -U payflow_admin -d payflow_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The application connects as payflow_app, the role created by
      # migration 001 (it has no UPDATE/DELETE on the ledger tables).
      DATABASE_URL: postgresql://payflow_app:payflow_app_dev_password@localhost:5432/payflow_db?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-with-at-least-thirty-two-bytes
      CLIENT_URL: http://localhost:5173
      RUN_DB_E2E: 'true'
      # Demo password of the seeded accounts, kept in GitHub Actions secrets
      # (Settings > Secrets and variables > Actions > SEED_PASSWORD).
      SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: payflow-backend/package-lock.json

      - run: npm ci

      - run: npm run prisma:generate

      # Apply every migration in order as the database owner.
      - name: Apply migrations
        env:
          PGPASSWORD: ci_admin_password
        run: |
          for file in $(ls migrations/*.up.sql | sort); do
            echo "Applying $file"
            psql -h localhost -U payflow_admin -d payflow_db -v ON_ERROR_STOP=1 -f "$file"
          done

      # Load the demo data (admin, agents, customers, merchants, ledger).
      - name: Load demo seed
        env:
          PGPASSWORD: ci_admin_password
        run: psql -h localhost -U payflow_admin -d payflow_db -v ON_ERROR_STOP=1 -f seed/seed.sql

      # Without the secret the seed tests would be skipped and the job would
      # still look green, so fail loudly instead.
      - name: Check the seed password secret
        run: |
          if [ -z "$SEED_PASSWORD" ]; then
            echo "::error::Repository secret SEED_PASSWORD is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - run: npm run test:e2e -- --runInBand
