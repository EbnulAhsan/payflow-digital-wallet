# Staging stack (SRS 2: GitHub Actions deploys Docker Compose to one server).
# Secrets come from an env file on the server, never from the repository:
#   POSTGRES_ADMIN_PASSWORD, JWT_ACCESS_SECRET (>= 32 bytes), CLIENT_URL
#
#   docker compose -f docker-compose.staging.yml --env-file /opt/payflow/staging.env up -d --build
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: payflow_db
      POSTGRES_USER: payflow_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payflow_admin -d payflow_db']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies the migrations that have not run yet, then exits.
  migrate:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: payflow_db
      PGUSER: payflow_admin
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD}
    volumes:
      - ./payflow-backend/migrations:/migrations:ro
      - ./deploy/migrate.sh:/migrate.sh:ro
    entrypoint: ['sh', '/migrate.sh']
    restart: 'no'

  api:
    build: ./payflow-backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      # payflow_app is created by migration 001 (no UPDATE/DELETE on the ledger).
      DATABASE_URL: postgresql://payflow_app:payflow_app_dev_password@postgres:5432/payflow_db?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      CLIENT_URL: ${CLIENT_URL:?set CLIENT_URL}

  web:
    build: ./payflow-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-80}:80'

volumes:
  postgres_data:
